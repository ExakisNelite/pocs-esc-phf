name: 'PR notification'

on:
  workflow_call:
    inputs:
      notify_actions:
        description: 'Comma-separated pull request actions to notify. Use merged to notify only merged closed pull requests.'
        type: string
        required: false
        default: 'opened,reopened'
      teams_theme_color:
        description: 'Deprecated: Adaptive Cards do not support custom hex colors. Kept for backward compatibility, value is ignored.'
        type: string
        required: false
        default: '0076D7'
      title_prefix:
        description: 'Prefix used in the Teams notification title.'
        type: string
        required: false
        default: 'Pull Request'
      runners:
        description: 'Runner used to send the notification.'
        type: string
        required: false
        default: 'ubuntu-latest'
    secrets:
      TEAMS_WEBHOOK_URL:
        required: true

permissions:
  contents: read

jobs:
  pr-notification:
    name: 'Notify PR status'
    runs-on: ${{ inputs.runners }}
    steps:
      - name: Notify Microsoft Teams
        uses: actions/github-script@v9 # 3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          NOTIFY_ACTIONS: ${{ inputs.notify_actions }}
          TITLE_PREFIX: ${{ inputs.title_prefix }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const action = context.payload.action;
            const teamsWebhookUrl = process.env.TEAMS_WEBHOOK_URL;
            const notifyActions = process.env.NOTIFY_ACTIONS
              .split(',')
              .map((value) => value.trim())
              .filter(Boolean);

            if (!pr) {
              core.info('This workflow was not triggered by a pull_request event. Skipping notification.');
              return;
            }

            if (!teamsWebhookUrl) {
              core.setFailed('TEAMS_WEBHOOK_URL secret is required to send PR notifications.');
              return;
            }

            const notificationAction = action === 'closed' && pr.merged ? 'merged' : action;
            if (!notifyActions.includes(notificationAction)) {
              core.info(`PR #${pr.number} action '${notificationAction}' is not configured for notification.`);
              return;
            }

            // The Power Automate 'When a Teams webhook request is received' endpoint expects an
            // Adaptive Card envelope. The legacy MessageCard format is not supported by it.
            const message = {
              type: 'message',
              attachments: [
                {
                  contentType: 'application/vnd.microsoft.card.adaptive',
                  contentUrl: null,
                  content: {
                    $schema: 'http://adaptivecards.io/schemas/adaptive-card.json',
                    type: 'AdaptiveCard',
                    version: '1.4',
                    msteams: { width: 'Full' },
                    body: [
                      {
                        type: 'TextBlock',
                        text: `${process.env.TITLE_PREFIX} #${pr.number} ${notificationAction}`,
                        weight: 'Bolder',
                        size: 'Large',
                        color: 'Accent',
                        wrap: true,
                      },
                      {
                        type: 'TextBlock',
                        text: pr.title,
                        weight: 'Bolder',
                        size: 'Medium',
                        wrap: true,
                      },
                      {
                        type: 'TextBlock',
                        text: `by ${pr.user.login}`,
                        isSubtle: true,
                        spacing: 'None',
                        wrap: true,
                      },
                      {
                        type: 'FactSet',
                        facts: [
                          { title: 'Repository', value: pr.base.repo.full_name },
                          { title: 'Branch', value: pr.head.ref },
                          { title: 'Target', value: pr.base.ref },
                        ],
                      },
                    ],
                    actions: [
                      {
                        type: 'Action.OpenUrl',
                        title: 'View pull request',
                        url: pr.html_url,
                      },
                    ],
                  },
                },
              ],
            };

            const response = await fetch(teamsWebhookUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(message),
            });

            if (!response.ok) {
              const responseBody = await response.text();
              core.setFailed(`Error sending notification to Microsoft Teams: ${response.status} ${response.statusText} ${responseBody}`);
              return;
            }

            core.info('Notification sent to Microsoft Teams.');